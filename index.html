<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AG CARS KARIMNAGAR — Second-hand Cars</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header with logo + name -->
  <header class="site-header">
    <div class="brand">
      <img src="images/logo.png" alt="AG Cars Logo" class="logo"
           onerror="this.style.display='none'" />
      <div class="brand-text">
        <span class="brand-name">AG CARS</span>
        <span class="brand-city">KARIMNAGAR</span>
      </div>
    </div>
    <div class="tagline">Quality second-hand cars</div>
  </header>

  <!-- Customer car grid -->
  <main>
    <h1 class="page-title">Available Cars</h1>
    <section id="car-list" class="car-grid"></section>
    <p id="empty-msg" class="empty-msg" hidden>No cars available right now. Please check back soon.</p>
  </main>

  <!-- Car detail popup (hidden until a car is clicked) -->
  <div id="car-detail" class="detail-overlay" hidden>
    <div class="detail-box">
      <button class="close-btn" id="close-detail" aria-label="Close">&times;</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <section class="map-section">
    <h2 class="map-title">Visit Us</h2>
    <div class="map-wrap">
      <iframe
        src="https://www.google.com/maps?q=18.412175,79.134104&output=embed"
        width="100%" height="300" style="border:0"
        allowfullscreen loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
    <a class="map-link" href="https://maps.app.goo.gl/Le11pBL2giMgtD6c6" target="_blank" rel="noopener">
      Open in Google Maps
    </a>
  </section>

  <footer class="site-footer">
    <p>AG CARS KARIMNAGAR &middot; Karimnagar, Telangana</p>
  </footer>

  <!-- Car data first, then the page logic -->
  <script src="cars.js"></script>
  <script src="script.js"></script>
</body>
</html>
